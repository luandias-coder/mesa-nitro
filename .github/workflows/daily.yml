name: captura-diaria
on:
  schedule:
    - cron: '40 21 * * 1-5'      # 18:40 BRT (UTC-3) = 21:40 UTC, dias úteis
  workflow_dispatch: {}           # botão de teste manual
concurrency:
  group: captura
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports: ['4416:4416']
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      PLAYLIST: 'https://www.youtube.com/playlist?list=PLBXPCoq0WOd7zEXdiGj_I61SmJ-Ces94p'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Runtime JS (deno) p/ desafio do player YouTube
        uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Instalar deps
        run: pip install -q -U yt-dlp bgutil-ytdlp-pot-provider anthropic pyyaml
      - name: Provider PO token (espera subir)
        run: for i in $(seq 1 15); do curl -sf http://127.0.0.1:4416/ping && break || sleep 2; done
      - name: Cookies do YouTube (opcional, se o secret existir)
        env: { YTC: '${{ secrets.YOUTUBE_COOKIES }}' }
        run: |
          if [ -n "$YTC" ]; then printf '%s\n' "$YTC" > cookies.txt; echo "cookies.txt criado ($(wc -l < cookies.txt) linhas)"; else echo "sem cookies (tentando cookieless: deno + PO token)"; fi
      - name: Achar vídeo do dia
        id: vid
        run: |
          [ -s cookies.txt ] && CK="--cookies cookies.txt" || CK=""
          DDMM=$(TZ=America/Sao_Paulo date +%d/%m); ISO=$(TZ=America/Sao_Paulo date +%F)
          VID=$(yt-dlp $CK --flat-playlist --print '%(id)s|%(title)s' "$PLAYLIST" 2>/dev/null | grep -F "$DDMM" | head -1 | cut -d'|' -f1)
          echo "iso=$ISO" >> $GITHUB_OUTPUT
          echo "vid=$VID" >> $GITHUB_OUTPUT
          echo "Vídeo de $DDMM: ${VID:-nenhum}"
      - name: Notifica início (Telegram)
        if: env.TG_TOKEN != ''
        run: |
          ISO='${{ steps.vid.outputs.iso }}'; VID='${{ steps.vid.outputs.vid }}'
          if [ -n "$VID" ]; then
            MSG="🎬 <b>Mesa Nitro</b> — cron disparou. Processando a live de <b>$ISO</b> (vídeo $VID)…"
          else
            MSG="🔕 <b>Mesa Nitro</b> — cron rodou em $ISO mas <b>não achou live</b> na playlist (feriado/sem live, ou cookie do YouTube expirado)."
          fi
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=$MSG" -d parse_mode=HTML >/dev/null || true
      - name: Captura + pipeline
        if: steps.vid.outputs.vid != ''
        run: |
          set -e
          ISO=${{ steps.vid.outputs.iso }}; VID=${{ steps.vid.outputs.vid }}
          [ -s cookies.txt ] && CK="--cookies cookies.txt" || CK=""
          mkdir -p subs
          yt-dlp $CK --extractor-args "youtube:player_client=web_creator" --ignore-no-formats-error --skip-download --write-auto-subs --sub-langs pt-orig --sub-format vtt -o "subs/%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$VID"
          python vtt_to_transcript.py "subs/$VID.pt-orig.vtt" "transcript_${ISO}.txt"
          python - "$ISO" "$VID" <<'PY'
          import json,sys,os
          iso,vid=sys.argv[1],sys.argv[2]
          d=json.load(open("videos.json")) if os.path.exists("videos.json") else {}
          d[iso]=vid; json.dump(d,open("videos.json","w"),indent=2,ensure_ascii=False)
          PY
          python parser.py "transcript_${ISO}.txt" --data "$ISO" --out "signals_parsed_${ISO}.json"
          python resolver.py "signals_parsed_${ISO}.json" --out "signals_resolved_${ISO}.json"
          python load_supabase.py
      - name: Commit dados do dia
        if: steps.vid.outputs.vid != ''
        run: |
          git config user.name "Luan Dias"; git config user.email "luan.dias@lxlbusiness.com"
          rm -f cookies.txt
          git add signals_*_*.json transcript_*.txt videos.json 2>/dev/null || true
          git commit -m "dados ${{ steps.vid.outputs.iso }} [skip vercel]" || echo "nada a commitar"
          git push || echo "push falhou (segue)"
      - name: Notifica sucesso (Telegram)
        if: success() && steps.vid.outputs.vid != '' && env.TG_TOKEN != ''
        run: |
          ISO='${{ steps.vid.outputs.iso }}'
          MSG="✅ <b>Mesa Nitro</b> — live de <b>$ISO</b> processada e no dashboard. Confira a fila de ação."
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=$MSG" -d parse_mode=HTML >/dev/null || true
      - name: Notifica falha (Telegram) — provável cookie expirado
        if: failure() && env.TG_TOKEN != ''
        run: |
          ISO=$(TZ=America/Sao_Paulo date +%F)
          MSG="⚠️ <b>Mesa Nitro</b> — a captura de <b>$ISO</b> FALHOU. Causa provável: <b>cookie do YouTube expirou</b> (renova o cookies.txt e me manda) ou bloqueio do YT. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=$MSG" -d parse_mode=HTML >/dev/null || true

