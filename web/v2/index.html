<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Replicação · Nitro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<meta name="theme-color" content="#5469D4">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa Nitro v2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
 :root{
  --bg:#F6F8FB;--surface:#FFFFFF;--surface2:#F2F5F9;--line:#E3E8EF;
  --text:#1A1F36;--dim:#5A6577;--faint:#8A94A6;
  --brand:#5469D4;--brand-bg:#EEF1FD;
  --alta:#1A9D5B;--alta-bg:#E6F6ED;--baixa:#D6324B;--baixa-bg:#FCEBEE;
  --gold:#B0780A;--gold-bg:#FBF1DC;--radius:12px;
  --sh:0 1px 1px rgba(0,0,0,.03),0 3px 6px rgba(0,0,0,.05);
  --sh-lg:0 10px 30px rgba(20,30,60,.16);
  --sans:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:40px}
 .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
 .pos{color:var(--alta)} .neg{color:var(--baixa)} .dim{color:var(--dim)}
 header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
 .top-row{display:flex;align-items:center;gap:14px;padding:13px 22px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
 .brand{font-weight:700;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
 .brand .nitro{color:var(--brand)}
 .mkt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);font-weight:500}
 .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)} .dot.on{background:var(--alta);box-shadow:0 0 0 3px var(--alta-bg)} .dot.off{background:var(--baixa);box-shadow:0 0 0 3px var(--baixa-bg)}
 .top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--dim);box-shadow:var(--sh)}
 .pill b{color:var(--text)}
 .pill.safe{background:var(--gold-bg);border-color:#EAD9AE;color:var(--gold);font-weight:600}
 main{max-width:1080px;margin:0 auto;padding:20px 22px 60px}
 /* PAINEL DE MÉTRICAS (placar) */
 .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:8px}
 .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:13px 16px;display:flex;flex-direction:column;gap:3px}
 .metric .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:600}
 .metric .val{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.5px}
 .metric .sub{font-size:11px;color:var(--faint)}
 .metric.hero{grid-column:span 1;background:linear-gradient(135deg,#5469D4,#6C7FE0);border:none;color:#fff}
 .metric.hero .lab{color:rgba(255,255,255,.85)} .metric.hero .sub{color:rgba(255,255,255,.8)}
 /* GROUP */
 .grp{margin-top:26px}
 .grp-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
 .grp-h h2{font-size:15px;font-weight:700;letter-spacing:-.2px;margin:0}
 .grp-h .cnt{font-family:var(--mono);font-size:12px;background:var(--brand-bg);color:var(--brand);border-radius:7px;padding:2px 8px;font-weight:700}
 .grp-h .hint{font-size:12px;color:var(--faint);margin-left:auto}
 /* LINHA DE AÇÃO */
 .row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(160px,1.3fr) 1fr 1.1fr auto;gap:14px;align-items:center;border-left:4px solid var(--line);transition:opacity .2s,box-shadow .2s}
 .row:hover{box-shadow:var(--sh-lg)}
 .row.call{border-left-color:var(--alta)} .row.put{border-left-color:var(--baixa)}
 .row.done{opacity:.62} .row.skip{opacity:.45}
 .cell{display:flex;flex-direction:column;gap:3px;min-width:0}
 .cell .k{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:600}
 .what{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
 .acao{font-weight:700;font-size:10.5px;letter-spacing:.4px;padding:3px 8px;border-radius:6px;white-space:nowrap}
 .acao.call{background:var(--alta-bg);color:var(--alta)} .acao.put{background:var(--baixa-bg);color:var(--baixa)} .acao.sell{background:var(--baixa-bg);color:var(--baixa)} .acao.adj{background:var(--brand-bg);color:var(--brand)}
 .under{font-weight:700;font-size:16px;letter-spacing:-.3px}
 .tk{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--gold);background:var(--gold-bg);border:1px solid #EAD9AE;border-radius:7px;padding:3px 9px;cursor:pointer}
 .tk.copied{background:var(--alta-bg);color:var(--alta);border-color:var(--alta)}
 .tk.bad{color:var(--baixa);background:var(--baixa-bg);border-color:var(--baixa);cursor:default}
 .sz{font-family:var(--mono);font-weight:700;font-size:15px}
 .sz small{font-family:var(--sans);font-weight:500;color:var(--faint);font-size:11px}
 .price{font-family:var(--mono);font-weight:700;font-size:15px}
 .price .live{font-size:11px;color:var(--dim);font-weight:500}
 .pnl{font-family:var(--mono);font-weight:700;font-size:17px}
 .pnl small{font-family:var(--sans);font-weight:600;font-size:11px;display:block}
 .rec{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;display:inline-block;white-space:nowrap;margin-top:3px}
 .rec.go{background:var(--alta-bg);color:var(--alta)} .rec.maybe{background:var(--gold-bg);color:var(--gold)} .rec.stop{background:var(--baixa-bg);color:var(--baixa)} .rec.wait{background:var(--surface2);color:var(--dim)}
 .actcell{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:120px}
 .btn{font-family:var(--sans);font-weight:600;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);transition:all .14s;white-space:nowrap;text-align:center}
 .btn:hover{background:var(--surface2)} .btn:disabled{opacity:.5;cursor:default}
 .btn.exec{background:var(--brand);color:#fff;border-color:var(--brand)} .btn.exec:hover{filter:brightness(1.06)}
 .btn.close{background:var(--baixa-bg);color:var(--baixa);border-color:#f3c6cf} .btn.close:hover{background:var(--baixa);color:#fff}
 .btn.skip,.btn.ghost{background:transparent;color:var(--dim);padding:5px} .btn.skip:hover{color:var(--baixa)}
 .stp{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;text-align:center}
 .stp.done{background:var(--alta-bg);color:var(--alta)} .stp.pend{background:var(--gold-bg);color:var(--gold)} .stp.skip{background:var(--surface2);color:var(--dim)} .stp.bad{background:var(--baixa-bg);color:var(--baixa)}
 .manualval{grid-column:1/-1;font-size:12px;color:var(--baixa);background:var(--baixa-bg);border:1px solid var(--baixa);border-radius:8px;padding:6px 10px;font-weight:600}
 .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--dim)}
 .foot{max-width:1080px;margin:0 auto;padding:14px 22px;color:var(--faint);font-size:11.5px;text-align:center}
 .foot a{color:var(--brand)}
 @media (max-width:820px){.metrics{grid-template-columns:repeat(2,1fr)}}
 @media (max-width:720px){
   .row{grid-template-columns:1fr 1fr;gap:10px}
   .actcell{grid-column:1/-1;flex-direction:row}
   .actcell .btn{flex:1}
 }
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">📈 Mesa de <span class="nitro">Replicação</span></div>
    <div class="mkt"><span class="dot" id="mktdot"></span><span id="mktlbl">—</span></div>
    <div class="top-right">
      <span class="pill">Live: <b id="dlatest">—</b></span>
      <span class="pill safe">conta real · dry-run</span>
    </div>
  </div>
</header>
<main>
  <div class="metrics" id="metrics"></div>

  <section class="grp" id="grp-hoje">
    <div class="grp-h"><h2>⚡ Ações de hoje (da live)</h2><span class="cnt" id="cnt-hoje">0</span><span class="hint" id="hint-hoje"></span></div>
    <div id="list-hoje"></div>
  </section>

  <section class="grp" id="grp-cart">
    <div class="grp-h"><h2>📊 Minha carteira</h2><span class="cnt" id="cnt-cart">0</span><span class="hint">posições que você executou · P&L ao vivo</span></div>
    <div id="list-cart"></div>
  </section>
</main>
<div class="foot" id="foot">Mesa Nitro v2 · <a href="/">← dashboard clássico</a></div>

<script>
const SB_URL="https://mqcryomwdwnosoqfmyak.supabase.co", SB_KEY="sb_publishable_GozaOIA6rPwYFpgiOh60lg_OAmWvMCP";
const sbh={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
const ORDEM_CONTA="real";  // B: conta real, dry-run via AUTO_SEND=0 na ponte
const CFG={pool:12000,caixa_pct:0,peso_pct:0.05,n_alvo:19,lote:100};
const LOTE=CFG.lote;
const ACTIVE=new Set(['aprovada','fila_abertura','executada','validada_dry_run']); // ordem "viva" = posição minha
let DATA={meta:{},today:[],portfolio:[],ordens:{}};

async function sbGet(p){try{const r=await fetch(SB_URL+"/rest/v1/"+p,{headers:sbh});return r.ok?await r.json():[];}catch(e){return [];}}
function sizeContracts(p){if(!p||!CFG)return null;const N=CFG.n_alvo;const alvo=Math.min(CFG.pool*CFG.peso_pct,CFG.pool*(1-CFG.caixa_pct)/N);return Math.max(1,Math.round(alvo/(p*LOTE)));}
const nf=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>(v==null||v==='')?'—':'R$ '+nf.format(+v);
const pct=v=>(v==null)?'—':(v>=0?'+':'')+(+v).toFixed(1)+'%';
const brdate=iso=>{if(!iso)return'—';const m=String(iso).slice(0,10).split('-');return m.length===3?`${m[2]}/${m[1]}/${m[0].slice(2)}`:iso;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pnlPct=(e,c)=>{e=+e;c=+c;if(!e||isNaN(e)||isNaN(c))return null;return(c/e-1)*100;};

async function loadAll(){
  const [lives,sin,pos,ord]=await Promise.all([
    sbGet("lives?select=*&order=data.asc"),
    sbGet("sinais?select=*&order=data.asc,ts.asc"),
    sbGet("posicoes_analista?select=*"),
    sbGet("ordens?select=op_id,id,status,codigo,volume,preco_limite,preco_exec,acao,conta")]);
  const latest=lives.length?lives[lives.length-1]:{};
  const datas=[...new Set(sin.map(s=>s.data))].sort();
  const fila=datas.length?datas[datas.length-1]:latest.data;
  DATA.meta={data_latest:latest.data,fila_data:fila,analista:latest.analista,lives:lives.length};
  DATA.portfolio=pos.map(p=>({underlying:p.underlying,tipo:p.tipo,codigo:p.codigo,strike:p.strike,venc:p.vencimento,entry:p.entry,atual:p.atual,conf:p.conf}));
  DATA.today=sin.filter(s=>s.data===fila).map(s=>({id:s.data+"__"+s.codigo+"__"+s.acao+"__"+s.ts,acao:s.acao,underlying:s.underlying,tipo:s.tipo,codigo:s.codigo,strike:s.strike,venc:s.vencimento,limite:s.preco_limite,atual:s.preco_atual,motivo:s.motivo}));
  DATA.ordens={};ord.forEach(o=>{DATA.ordens[o.op_id]=o;});
  // mapas auxiliares por código
  DATA._meta={}; DATA._live={};
  [...DATA.portfolio, ...DATA.today].forEach(x=>{ if(x.codigo){ if(!DATA._meta[x.codigo])DATA._meta[x.codigo]={underlying:x.underlying,tipo:x.tipo,strike:x.strike,venc:x.venc}; const lv=(x.atual!=null?x.atual:null); if(lv!=null)DATA._live[x.codigo]=lv; } });
}
async function reloadOrdens(){const ord=await sbGet("ordens?select=op_id,id,status,codigo,volume,preco_limite,preco_exec,acao,conta");DATA.ordens={};ord.forEach(o=>DATA.ordens[o.op_id]=o);}

// ----- ordens ativas por código (posições que eu tenho) -----
function activeByCodigo(){const m={};Object.values(DATA.ordens).forEach(o=>{if(o&&ACTIVE.has(o.status)&&o.codigo){if(!m[o.codigo]||o.status==='executada')m[o.codigo]=o;}});return m;}
function activeCodigos(){return new Set(Object.keys(activeByCodigo()));}
function ordOf(opid){return DATA.ordens[opid]||null;}
function entradaOpId(cod){return 'entrada__'+cod+'__'+(DATA.meta.fila_data||DATA.meta.data_latest||'x');}

// ----- badges -----
function recBadge(lim,at){if(lim==null)return '<span class="rec wait">sem limite</span>';if(at==null)return '<span class="rec wait">sem preço live</span>';lim=+lim;at=+at;if(!lim)return '<span class="rec wait">—</span>';const d=(at-lim)/lim*100;if(at<=lim)return `<span class="rec go">✅ dá entrar · ${d>=0?'+':''}${d.toFixed(0)}%</span>`;if(d<=10)return `<span class="rec maybe">⚠️ +${d.toFixed(0)}% vs limite</span>`;return `<span class="rec stop">⛔ acima · +${d.toFixed(0)}%</span>`;}
function acaoBadge(acao,tipo){if(acao==='saida')return '<span class="acao sell">VENDER (saída)</span>';if(acao==='ajuste_delta')return '<span class="acao adj">AJUSTE Δ</span>';const t=(tipo||'').toUpperCase();return `<span class="acao ${t==='PUT'?'put':'call'}">COMPRAR ${esc(t||'—')}</span>`;}
function rowClass(tipo){const t=(tipo||'').toUpperCase();return t==='PUT'?'put':(t==='CALL'?'call':'');}
function tkChip(cod,bad){if(!cod)return '<span class="tk bad">sem ticker</span>';if(bad)return `<span class="tk bad" title="ticker inválido">${esc(cod)} ⚠</span>`;return `<span class="tk" data-copy="${esc(cod)}" title="copiar">${esc(cod)}</span>`;}
function statusPill(o){if(!o)return null;const s=o.status;if(s==='cancelada')return '<div class="stp skip">pulada</div>';if(s==='ticker_invalido')return '<div class="stp bad">⚠️ ticker inválido</div>';if(s==='erro')return '<div class="stp bad">erro</div>';if(s==='pendente'||s==='notificada')return null;return null;}

// ===== AÇÕES DE HOJE (só sinais que ainda não viraram posição minha) =====
function buildToday(){
  const ac=activeCodigos();
  return DATA.today.filter(op=>!ac.has(op.codigo)).map(op=>{
    const ord=ordOf(op.id);
    const vol=op.limite?sizeContracts(op.limite):null;
    let manual=null; if(!op.codigo)manual='ticker não reconhecido'; else if(op.limite==null)manual='sem preço da live';
    const bad=ord&&ord.status==='ticker_invalido';
    return {opid:op.id,acao:op.acao,tipo:op.tipo,underlying:op.underlying,codigo:op.codigo,strike:op.strike,venc:op.venc,limite:op.limite,atual:op.atual,vol,manual,bad,ord,
      _create:{op_id:op.id,conta:ORDEM_CONTA,codigo:op.codigo,acao:(op.acao==='saida'?'vender':'comprar'),volume:vol||1,preco_limite:op.limite,status:'aprovada'}};
  });
}
function todayRowHTML(it){
  const sp=statusPill(it.ord);
  const sz=it.vol?`${it.vol} <small>contrato(s)</small>`:'—';
  const manual=it.manual?`<div class="manualval">⚠️ Validação manual: ${esc(it.manual)} — confira antes</div>`:'';
  let act;
  if(it.ord&&(it.ord.status==='cancelada'))act='<div class="stp skip">pulada</div>';
  else if(it.bad)act='<div class="stp bad">⚠️ ticker inválido</div>';
  else act=`<button class="btn exec" data-exec="${esc(it.opid)}">▶ Executar</button><button class="btn skip" data-skip="${esc(it.opid)}">pular</button>`;
  return `<div class="row ${rowClass(it.tipo)} ${it.ord&&it.ord.status==='cancelada'?'skip':''}">
    <div class="cell"><span class="k">O quê</span><div class="what">${acaoBadge(it.acao,it.tipo)} <span class="under">${esc(it.underlying)}</span></div><div style="margin-top:4px">${tkChip(it.codigo,it.bad)}</div></div>
    <div class="cell"><span class="k">Quanto</span><span class="sz">${sz}</span><span class="dim" style="font-size:11px">strike ${brl(it.strike)} · ${brdate(it.venc)}</span></div>
    <div class="cell"><span class="k">Preço (limite · live)</span><span class="price">${brl(it.limite)} <span class="live">live ${brl(it.atual)}</span></span>${recBadge(it.limite,it.atual)}</div>
    <div class="actcell">${act}</div>${manual}
  </div>`;
}

// ===== MINHA CARTEIRA (posições com ordem ativa) + P&L ao vivo =====
function buildCarteira(){
  const m=activeByCodigo();
  return Object.values(m).map(o=>{
    const cod=o.codigo, meta=DATA._meta[cod]||{};
    const entry=(o.preco_exec!=null?o.preco_exec:o.preco_limite);
    const live=(DATA._live[cod]!=null?DATA._live[cod]:null);
    const qtd=o.volume||null;
    const p=pnlPct(entry,live);
    const pnlR=(entry!=null&&live!=null&&qtd)?((+live)-(+entry))*qtd*LOTE:null;
    return {cod,underlying:meta.underlying||cod,tipo:meta.tipo,strike:meta.strike,venc:meta.venc,entry,live,qtd,p,pnlR,status:o.status};
  }).sort((a,b)=>(b.p??-999)-(a.p??-999));
}
function cartRowHTML(h){
  const cls=h.p==null?'':(h.p>=0?'pos':'neg');
  const stp=h.status==='executada'?'':`<span class="dim" style="font-size:10.5px">(${esc(h.status)})</span>`;
  return `<div class="row ${rowClass(h.tipo)}">
    <div class="cell"><span class="k">Posição ${stp}</span><div class="what">${h.tipo?acaoBadge('entrada',h.tipo).replace('COMPRAR ','').replace(/^<span class="acao/,'<span class="acao'):''} <span class="under">${esc(h.underlying)}</span></div><div style="margin-top:4px">${tkChip(h.cod)}</div></div>
    <div class="cell"><span class="k">Entrada · Atual</span><span class="price">${brl(h.entry)} <span class="live">→ ${brl(h.live)}</span></span><span class="dim" style="font-size:11px">${h.qtd?h.qtd+' contr':''}${h.strike?' · strike '+nf.format(h.strike):''}</span></div>
    <div class="cell"><span class="k">P&L</span><span class="pnl ${cls}">${pct(h.p)}<small class="${cls}">${h.pnlR!=null?(h.pnlR>=0?'+':'')+brl(h.pnlR):''}</small></span></div>
    <div class="actcell"><button class="btn close" data-close="${esc(h.cod)}">Encerrar</button></div>
  </div>`;
}

// ===== PAINEL DE MÉTRICAS =====
function metrics(){
  const cart=buildCarteira();
  const n=cart.length;
  const calls=cart.filter(h=>(h.tipo||'').toUpperCase()==='CALL').length;
  const puts=cart.filter(h=>(h.tipo||'').toUpperCase()==='PUT').length;
  let inv=0,pl=0,havePL=false;
  cart.forEach(h=>{const q=h.qtd||0;if(h.entry!=null){inv+=(+h.entry)*q*LOTE;}if(h.pnlR!=null){pl+=h.pnlR;havePL=true;}});
  const plPct=inv?pl/inv*100:null;
  const sala=DATA.portfolio.filter(p=>p.codigo).length;
  const cards=[
    {hero:true,lab:'P&L da carteira',val:havePL?pct(plPct):'—',sub:havePL?(pl>=0?'+':'')+brl(pl):'sem dados',cls:''},
    {lab:'Posições',val:n,sub:`replicando ${n}/${sala} da Sala`},
    {lab:'Investido',val:inv?brl(inv):'—',sub:'capital alocado'},
    {lab:'PUT · CALL',val:`${puts} · ${calls}`,sub:'exposição'},
    {lab:'Aderência',val:'100%',sub:'meta a partir de hoje'},
  ];
  document.getElementById('metrics').innerHTML=cards.map(c=>`<div class="metric ${c.hero?'hero':''}"><span class="lab">${c.lab}</span><span class="val ${c.hero?'':(c.cls||'')}">${c.val}</span><span class="sub">${c.sub}</span></div>`).join('');
}

// ===== AÇÕES 1-tap =====
let _idx={};
async function execItem(opid){
  const it=_idx[opid];if(!it)return;
  if(it.bad){alert('Ticker inválido no broker.');return;}
  if(it.manual){if(!confirm('⚠️ Precisa validação manual ('+it.manual+'). Executar mesmo assim?'))return;}
  const c=it._create;
  if(!confirm('Executar (1-tap):\n\n'+(c.acao==='vender'?'VENDER':'COMPRAR')+' '+(it.codigo||'?')+' · '+c.volume+' contrato(s) @ limite '+brl(c.preco_limite)+'\nConta REAL · cria ordem JÁ APROVADA.\n(AUTO_SEND=0 = dry-run, não dispara real ainda.)'))return;
  try{
    const ex=ordOf(opid);
    if(ex&&(ex.status==='pendente'||ex.status==='notificada'))
      await fetch(SB_URL+"/rest/v1/ordens?op_id=eq."+encodeURIComponent(opid),{method:"PATCH",headers:sbh,body:JSON.stringify({status:'aprovada',atualizado_em:new Date().toISOString()})});
    else
      await fetch(SB_URL+"/rest/v1/ordens",{method:"POST",headers:{...sbh,Prefer:"return=minimal,resolution=merge-duplicates"},body:JSON.stringify([c])});
    await reloadOrdens();render();
  }catch(e){console.warn(e);alert('Falhou — tenta de novo.');}
}
async function skipItem(opid){
  const it=_idx[opid];if(!it)return;
  if(!confirm('Pular '+(it.codigo||it.underlying)+'?'))return;
  try{
    const ex=ordOf(opid);
    if(ex)await fetch(SB_URL+"/rest/v1/ordens?op_id=eq."+encodeURIComponent(opid),{method:"PATCH",headers:sbh,body:JSON.stringify({status:'cancelada',atualizado_em:new Date().toISOString()})});
    else await fetch(SB_URL+"/rest/v1/ordens",{method:"POST",headers:{...sbh,Prefer:"return=minimal,resolution=merge-duplicates"},body:JSON.stringify([{...it._create,status:'cancelada'}])});
    await reloadOrdens();render();
  }catch(e){console.warn(e);}
}
async function closePos(cod){
  const h=buildCarteira().find(x=>x.cod===cod);if(!h)return;
  if(!confirm('ENCERRAR posição '+cod+'?\n\nVENDER '+(h.qtd||1)+' contrato(s) @ '+brl(h.live)+'\nCria ordem de venda JÁ APROVADA (conta real, dry-run via AUTO_SEND=0).'))return;
  try{
    await fetch(SB_URL+"/rest/v1/ordens",{method:"POST",headers:{...sbh,Prefer:"return=minimal,resolution=merge-duplicates"},
      body:JSON.stringify([{op_id:'encerra__'+cod+'__'+(DATA.meta.fila_data||'x'),conta:ORDEM_CONTA,codigo:cod,acao:'vender',volume:h.qtd||1,preco_limite:h.live,status:'aprovada'}])});
    await reloadOrdens();render();alert('Ordem de encerramento criada (venda). Acompanhe no Telegram/carteira.');
  }catch(e){console.warn(e);alert('Falhou encerrar.');}
}

// ===== RENDER =====
function render(){
  const hoje=buildToday(), cart=buildCarteira();
  _idx={}; hoje.forEach(it=>_idx[it.opid]=it);
  metrics();
  document.getElementById('cnt-hoje').textContent=hoje.length;
  document.getElementById('cnt-cart').textContent=cart.length;
  const mnt=DATA.meta.fila_data&&DATA.meta.data_latest&&DATA.meta.fila_data!==DATA.meta.data_latest;
  document.getElementById('hint-hoje').textContent=hoje.length?(mnt?('última live com ações: '+brdate(DATA.meta.fila_data)):('live de '+brdate(DATA.meta.fila_data))):'';
  document.getElementById('list-hoje').innerHTML=hoje.length?hoje.map(todayRowHTML).join(''):'<div class="empty">✅ Nada pendente da última live — tudo executado ou pulado.</div>';
  document.getElementById('list-cart').innerHTML=cart.length?cart.map(cartRowHTML).join(''):'<div class="empty">Nenhuma posição ainda. Execute uma ação de hoje que ela entra aqui com P&L.</div>';
  document.getElementById('dlatest').textContent=brdate(DATA.meta.fila_data||DATA.meta.data_latest);
}
function marketStatus(){const n=new Date(),d=n.getDay(),h=n.getHours()+n.getMinutes()/60,o=d>=1&&d<=5&&h>=10&&h<17;document.getElementById('mktdot').className='dot '+(o?'on':'off');document.getElementById('mktlbl').textContent=o?'B3 aberta · pregão':'B3 fechada';}

document.addEventListener('click',e=>{
  const cp=e.target.closest('.tk[data-copy]');if(cp){const v=cp.dataset.copy;navigator.clipboard&&navigator.clipboard.writeText(v);const o=cp.textContent;cp.classList.add('copied');cp.textContent='✓';setTimeout(()=>{cp.textContent=o;cp.classList.remove('copied');},800);return;}
  const ex=e.target.closest('[data-exec]');if(ex){execItem(ex.dataset.exec);return;}
  const sk=e.target.closest('[data-skip]');if(sk){skipItem(sk.dataset.skip);return;}
  const cl=e.target.closest('[data-close]');if(cl){closePos(cl.dataset.close);return;}
});
marketStatus();setInterval(marketStatus,60000);
loadAll().then(render);
setInterval(()=>{loadAll().then(render);},45000);
</script>
</body></html>
